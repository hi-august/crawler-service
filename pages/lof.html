<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="基金实时溢价">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>基金实时溢价</title>
    
    <link rel="dns-prefetch" href="//192.168.32.99">
    <link rel="preconnect" href="http://192.168.32.99:12316">
    
    <link rel="preload" href="tabler/tabler.min.css" as="style">
    <link rel="preload" href="tabler/font-awesome.min.css" as="style">
    <link rel="preload" href="tabler/tabler.min.js" as="script">
    
    <link rel="stylesheet" href="tabler/tabler.min.css">
    <link rel="stylesheet" href="tabler/font-awesome.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #64748b;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --border-color: #e5e7eb;
            --text-color: #1e293b;
            --text-muted: #6b7280;
            --row-even-bg: #f9fafb;
            --row-hover-bg: #f1f5f9;
            --shadow-soft: 0 1px 3px rgba(0, 0, 0, 0.05);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            line-height: 1.5;
        }
        
        .container-fluid {
            padding: 10px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .container-fluid {
                padding: 20px 30px;
            }
        }
        
        .page-header {
            margin-bottom: 2px;
            text-align: center;
        }
        
        .search-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
            max-width: 600px;
        }
        
        .search-wrapper {
            display: flex;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.2s ease;
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
        }
        
        .search-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        #search-input {
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            flex: 1;
            background-color: transparent;
            transition: all 0.3s ease;
        }
        
        #search-input:focus {
            outline: none;
        }
        
        #search-btn {
            border: none;
            padding: 0 22px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            font-weight: 500;
            font-size: 14px;
        }
        
        #search-btn:hover {
            background-color: #4f46e5;
        }
        
        #search-btn:active {
            background-color: #4338ca;
            transform: scale(0.98);
        }
        
        #search-btn i {
            font-size: 18px;
            margin-right: 6px;
        }
        
        .card {
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 3px;
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
        }
        
        .card-body {
            padding: 0;
        }
        
        .table-responsive {
            margin: 0;
            padding: 0;
        }
        
        .table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
            table-layout: fixed;
        }
        
        @media (min-width: 768px) {
            .table {
                font-size: 16px;
            }
            
            .card-footer {
                padding: 15px 25px;
            }
        }
        
        .table th {
            background-color: var(--card-background);
            font-weight: 600;
            padding: 10px 4px;
            text-align: center;
            white-space: nowrap;
            font-size: 12px;
            letter-spacing: 0.01em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        
        @media (min-width: 768px) {
            .table th {
                padding: 10px 8px;
                font-size: 15px;
            }
        }
        
        .table th:first-child {
            text-align: center;
        }
        
        .table th:nth-child(1) {
            width: 96px;
        }
        
        .table th:nth-child(2) {
            flex: 1;
            min-width: 78px;
            text-align: center;
        }
        
        .table th:nth-child(3) {
            width: 67px;
        }
        
        .table th:nth-child(4) {
            width: 67px;
        }
        
        .table th:nth-child(5) {
            width: 49px;
        }
        
        .table th:nth-child(6) {
            width: 56px;
        }
        
        @media (min-width: 768px) {
            .table th:nth-child(1) {
                width: 116px;
            }
            
            .table th:nth-child(2) {
                flex: 1;
                min-width: 147px;
                text-align: center;
            }
            
            .table th:nth-child(3) {
                width: 97px;
            }
            
            .table th:nth-child(4) {
                width: 97px;
            }
            
            .table th:nth-child(5) {
                width: 65px;
            }
            
            .table th:nth-child(6) {
                width: 71px;
            }
        }
        
        .table th:hover {
            background-color: var(--row-hover-bg);
        }
        
        .table td {
            padding: 7px 4px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.15s ease;
            font-weight: 400;
            text-align: center;
        }
        
        @media (min-width: 768px) {
            .table td {
                padding: 10px 8px;
            }
        }
        
        .table td:first-child {
            text-align: center;
        }
        
        .table td:nth-child(2) {
            text-align: center;
        }
        
        .table-hover tbody tr {
            transition: background-color 0.15s ease;
        }
        
        .table-hover tbody tr:nth-child(even) {
            background-color: var(--row-even-bg);
        }
        
        .table-hover tbody tr:nth-child(odd) {
            background-color: var(--card-background);
        }
        
        .table-hover tbody tr:hover {
            background-color: var(--row-hover-bg);
        }
        
        .card-footer {
            background-color: var(--card-background);
            padding: 10px 16px;
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            font-weight: 500;
            color: var(--text-muted);
        }
        
        .text-success {
            color: var(--success-color) !important;
            font-weight: 600;
        }
        
        .text-danger {
            color: var(--danger-color) !important;
            font-weight: 600;
        }
        
        .sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        
        .sortable:hover {
            background-color: var(--row-hover-bg);
        }
        
        .sortable i {
            margin-left: 8px;
            font-size: 11px;
            opacity: 0.5;
        }
        
        .sortable:hover i {
            opacity: 1;
        }
        
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        #loading-status {
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 500;
        }
        
        .pagination {
            font-size: 13px;
        }
        
        .btn {
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 6px;
            transition: all 0.15s ease;
            border: 1px solid var(--border-color);
            background-color: var(--card-background);
            color: var(--text-color);
            font-weight: 500;
        }
        
        .btn:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }
        
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .space-x-2 > * + * {
            margin-left: 12px;
        }
        
        .d-flex {
            display: flex;
        }
        
        .justify-content-between {
            justify-content: space-between;
        }
        
        .align-items-center {
            align-items: center;
        }
        
        .text-sm {
            font-size: 13px;
        }
        
        .mt-1 {
            margin-top:3px !important;
        }
        
        .text-muted {
            color: var(--text-muted);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container-fluid {
                padding: 15px;
            }
            
            .search-wrapper {
                border-radius: 12px;
            }
            
            #search-input {
                padding: 12px 16px;
                font-size: 14px;
            }
            
            #search-btn {
                padding: 0 20px;
            }
            
            .card {
                border-radius: 12px;
                margin-bottom: 20px;
            }
            
            .table th,
            .table td {
                padding: 10px 16px;
                font-size: 13px;
            }
            
            .card-footer {
                padding: 16px;
            }
            
            .btn {
                padding: 6px 16px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .container-fluid {
                padding: 8px;
            }
            
            .search-wrapper {
                border-radius: 8px;
            }
            
            #search-input {
                padding: 10px 12px;
                font-size: 13px;
            }
            
            #search-btn {
                padding: 0 12px;
            }
            
            #search-btn i {
                margin-right: 0;
            }
            
            .card {
                border-radius: 8px;
            }
            
            .table th,
            .table td {
                padding: 4px 2px;
                font-size: 12px;
            }
            
            .table th:nth-child(1) {
                width: 78px;
            }
            
            .table th:nth-child(2) {
                min-width: 59px;
            }
            
            .table th:nth-child(3) {
                width: 55px;
            }
            
            .table th:nth-child(4) {
                width: 55px;
            }
            
            .table th:nth-child(5) {
                width: 43px;
            }
            
            .table th:nth-child(6) {
                width: 45px;
            }
            
            .card-footer {
                padding: 10px 20px;
            }
            
            .btn {
                padding: 4px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="container-fluid">
        <div class="page-header">
            <div class="row mt-1 mb-2">
                <div class="col-12">
                    <div class="search-container">
                        <div class="search-wrapper">
                            <input type="text" id="search-input" placeholder="搜索基金代码">
                            <button id="search-btn">
                                <i class="fa fa-search"></i> 搜索
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>代码</th>
                                <th>名称</th>
                                <th class="sortable" data-sort="discount_rt">溢价<i class="fa fa-sort"></i></th>
                                <th class="sortable" data-sort="eastmoney_rt">东财<i class="fa fa-sort"></i></th>
                                <th>状态</th>
                                <th>涨幅</th>
                            </tr>
                        </thead>
                        <tbody id="fund-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="d-flex align-items-center">
                    <div class="me-auto">
                        <div id="pagination" class="pagination"></div>
                    </div>
                    <div id="loading-status" class="text-muted">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="tabler/tabler.min.js"></script>
    <script>
        let fundData = [];
        let currentSortField = null;
        let currentSortDirection = 'asc';
        const PAGE_SIZE = 18;
        let currentPage = 1;
        const CACHE_KEY = 'fund_data_cache';
        const CACHE_DURATION = 1 * 30 * 1000;
        
        const elements = {};
        
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        document.addEventListener('DOMContentLoaded', function() {
            cacheElements();
            loadFromCache();
            fetchFundData();
            setupEventListeners();
        });
        
        function cacheElements() {
            elements.searchInput = document.getElementById('search-input');
            elements.searchBtn = document.getElementById('search-btn');
            elements.tableBody = document.getElementById('fund-table-body');
            elements.pagination = document.getElementById('pagination');
            elements.loadingStatus = document.getElementById('loading-status');
            elements.loadingOverlay = document.getElementById('loading-overlay');
        }

        function setupEventListeners() {
            elements.searchBtn.addEventListener('click', function() {
                const searchTerm = elements.searchInput.value.trim();
                searchFunds(searchTerm);
            });
            
            const debouncedSearch = debounce(function(e) {
                const searchTerm = e.target.value.trim();
                searchFunds(searchTerm);
            }, 300);
            
            elements.searchInput.addEventListener('input', debouncedSearch);
            
            elements.searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchTerm = this.value.trim();
                    searchFunds(searchTerm);
                }
            });
            
            document.querySelectorAll('.sortable').forEach(header => {
                header.addEventListener('click', function() {
                    const sortField = this.getAttribute('data-sort');
                    sortTable(sortField);
                });
            });
        }

        function showLoading() {
            elements.loadingOverlay.classList.add('active');
        }

        function hideLoading() {
            elements.loadingOverlay.classList.remove('active');
        }

        function saveToCache(data) {
            const cacheData = {
                data: data,
                timestamp: Date.now()
            };
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
            } catch (e) {
                console.error('缓存保存失败:', e);
            }
        }

        function loadFromCache() {
            try {
                const cachedData = localStorage.getItem(CACHE_KEY);
                if (cachedData) {
                    const parsedData = JSON.parse(cachedData);
                    const now = Date.now();
                    if (now - parsedData.timestamp < CACHE_DURATION) {
                        fundData = parsedData.data;
                        const filteredData = filterPausedFunds(fundData);
                        renderTable(filteredData);
                        elements.loadingStatus.textContent = `共 ${filteredData.length} 条 (缓存)`;
                        elements.loadingStatus.className = 'text-success';
                        return true;
                    }
                }
            } catch (e) {
                console.error('缓存加载失败:', e);
            }
            return false;
        }

        function filterPausedFunds(data) {
            return data.filter(fund => fund.apply_status !== '暂停申购');
        }

        async function fetchFundData() {
            elements.loadingStatus.textContent = '加载中...';
            elements.loadingStatus.className = 'text-muted';

            try {
                showLoading();
                const response = await fetch('/api/today_rt?authorize_user=august&is_filtered=0');
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    fundData = data.data;
                    saveToCache(fundData);
                    const filteredData = filterPausedFunds(fundData);
                    renderTable(filteredData);
                    elements.loadingStatus.textContent = `共 ${filteredData.length} 条`;
                    elements.loadingStatus.className = 'text-success';
                } else {
                    throw new Error('数据格式错误');
                }
            } catch (error) {
                console.error('获取数据失败:', error);
                elements.loadingStatus.textContent = '加载失败';
                elements.loadingStatus.className = 'text-danger';
                if (!fundData.length) {
                    loadFromCache();
                }
            } finally {
                hideLoading();
            }
        }

        function renderTable(data) {
            const fragment = document.createDocumentFragment();
            
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageData = data.slice(start, end);

            pageData.forEach(fund => {
                const row = document.createElement('tr');
                const status = fund.apply_status === '开放申购' ? '' : (fund.apply_status || fund.status || '-');
                
                row.style.cursor = 'pointer';
                
                const navigateToDetail = (e) => {
                    const clickedCell = e.target.closest('td');
                    if (clickedCell && clickedCell.cellIndex === 0) {
                        return;
                    }
                    const url = `lof_detail.html?fund_id=${encodeURIComponent(fund.fund_id)}&fund_name=${encodeURIComponent(fund.fund_nm)}`;
                    window.location.href = url;
                };
                
                row.addEventListener('click', navigateToDetail);
                row.addEventListener('touchend', (e) => {
                    const clickedCell = e.target.closest('td');
                    if (clickedCell && clickedCell.cellIndex === 0) {
                        return;
                    }
                    e.preventDefault();
                    navigateToDetail(e);
                });
                
                row.innerHTML = `
                    <td style="cursor: text; user-select: text;">${fund.fund_id}</td>
                    <td>${fund.fund_nm}</td>
                    <td class="${fund.discount_rt >= 0 ? 'text-danger' : 'text-success'}">${fund.discount_rt.toFixed(2)}%</td>
                    <td class="${fund.eastmoney_rt >= 0 ? 'text-danger' : 'text-success'}">${fund.eastmoney_rt.toFixed(2)}%</td>
                    <td>${status}</td>
                    <td class="${fund.increase_rt >= 0 ? 'text-danger' : 'text-success'}">${fund.increase_rt.toFixed(2)}%</td>
                `;
                
                fragment.appendChild(row);
            });
            
            elements.tableBody.innerHTML = '';
            elements.tableBody.appendChild(fragment);
            
            updatePagination(data.length);
        }
        
        function updatePagination(totalItems) {
            const totalPages = Math.ceil(totalItems / PAGE_SIZE);
            
            elements.pagination.innerHTML = `
                <div class="d-flex align-items-center space-x-4">
                    <button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})" class="btn btn-sm btn-outline-secondary">
                        上一页
                    </button>
                    <button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})" class="btn btn-sm btn-outline-secondary">
                        下一页
                    </button>
                </div>
            `;
        }

        function getDisplayData(searchTerm) {
            if (!searchTerm) {
                return filterPausedFunds(fundData);
            }
            return fundData.filter(fund => {
                return fund.fund_id.toLowerCase().includes(searchTerm.toLowerCase());
            });
        }

        function sortTable(field) {
            currentPage = 1;
            
            if (currentSortField === field) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortField = field;
                currentSortDirection = 'asc';
            }

            const searchTerm = elements.searchInput.value.trim();
            const dataToSort = getDisplayData(searchTerm);
            
            const sortedData = [...dataToSort].sort((a, b) => {
                const aValue = a[field];
                const bValue = b[field];
                
                if (aValue < bValue) {
                    return currentSortDirection === 'asc' ? -1 : 1;
                }
                if (aValue > bValue) {
                    return currentSortDirection === 'asc' ? 1 : -1;
                }
                return 0;
            });

            document.querySelectorAll('.sortable i').forEach(icon => {
                icon.className = 'fa fa-sort';
            });
            
            const currentSortHeader = document.querySelector(`[data-sort="${field}"] i`);
            currentSortHeader.className = currentSortDirection === 'asc' ? 'fa fa-sort-asc' : 'fa fa-sort-desc';

            renderTable(sortedData);
            elements.loadingStatus.textContent = `共 ${sortedData.length} 条`;
            elements.loadingStatus.className = 'text-success';
        }

        function searchFunds(searchTerm) {
            currentPage = 1;
            
            const displayData = getDisplayData(searchTerm);
            
            renderTable(displayData);
            elements.loadingStatus.textContent = `共 ${displayData.length} 条`;
            elements.loadingStatus.className = 'text-success';
        }
        
        function changePage(page) {
            currentPage = page;
            const searchTerm = elements.searchInput.value.trim();
            const displayData = getDisplayData(searchTerm);
            renderTable(displayData);
        }
    </script>
</body>
</html>
